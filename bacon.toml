# bacon config for aozora-flavored-markdown. Launch with `just watch` (runs in the dev container,
# ADR-0002). Reference: https://dystroy.org/bacon/config/

default_job = "check"

# `--locked` on every job below, for the reason the Justfile states at length:
# Cargo.lock is the resolution of record and no command may quietly rewrite it.
# The watcher is the one that would — it re-runs on every keystroke, in the
# background, with nobody reading its first ten lines.

# Fast edit-compile loop; `cargo check` skips codegen.
[jobs.check]
command = ["cargo", "check", "--locked", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false
watch = ["crates", "spec"]
on_change_strategy = "kill_then_restart"

# [workspace.lints] is the single source of truth, so the flag surface is minimal.
[jobs.clippy]
command = [
    "cargo", "clippy", "--locked",
    "--workspace", "--all-targets", "--all-features",
    "--color", "always",
    "--", "-D", "warnings",
]
need_stdout = false

[jobs.test]
command = [
    "cargo", "nextest", "run", "--locked",
    "--workspace", "--all-targets",
    "--color", "always",
]
need_stdout = true
analyzer = "nextest"
