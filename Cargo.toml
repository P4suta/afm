[workspace]
resolver = "3"
members = [
    "crates/aozora-flavored-markdown",
    "crates/aozora-flavored-markdown-test-support",
    "crates/aozora-flavored-markdown-cli",
    "crates/aozora-flavored-markdown-wasm",
    # EPUB3 generator, consolidated from the former aozora-flavored-markdown-epub
    # sibling repo (ADR-0018). Independently versioned (see each crate's manifest).
    "crates/aozora-flavored-markdown-epub",
    "crates/aozora-flavored-markdown-epub-cli",
    "crates/xtask",
]

[workspace.package]
version       = "0.5.0"
edition       = "2024"
rust-version  = "1.96.0"
license       = "Apache-2.0 OR MIT"
description   = "Aozora Flavored Markdown: CommonMark/GFM + 青空文庫記法 integrated dialect built on the aozora parser"
repository    = "https://github.com/P4suta/aozora-flavored-markdown"
homepage      = "https://p4suta.github.io/aozora-flavored-markdown/"
documentation = "https://p4suta.github.io/aozora-flavored-markdown/api/"
authors       = ["aozora-flavored-markdown contributors"]
# No `readme` here on purpose. An inherited one is resolved against the
# WORKSPACE root, so `readme.workspace = true` put THIS file — the repository
# landing page — on all four crates.io pages, which is how the EPUB crate came
# to be described by a document that never says EPUB and how every relative
# link in it came to 404 (DEV-225). Each member names its own instead, and
# leaving the key undefined is what makes the inheriting spelling a hard error
# rather than a plausible-looking mistake.
keywords      = ["markdown", "aozora", "japanese", "typography", "parser"]
categories    = ["parser-implementations", "text-processing", "localization"]

[workspace.lints.rust]
unsafe_code      = "forbid"
non_ascii_idents = "deny" # all 日本語 is string literals, never identifiers

# The published surface has to explain itself. `warn` rather than `deny`
# because `just clippy` passes `-D warnings`, which makes it a gate anyway,
# while leaving a bare `cargo build` usable mid-edit. It is workspace-wide and
# not per-published-crate on purpose: `aozora-flavored-markdown-wasm`'s
# envelopes are the obsidian/playground `.d.ts` and
# `aozora-flavored-markdown-test-support`'s `Violation` variants are what a
# failing invariant prints, so both are read by someone who cannot see the
# source even though neither reaches crates.io.
missing_docs                  = "warn"

# Strong signals that tend to mask real bugs.
missing_debug_implementations = "warn"
missing_copy_implementations  = "warn"
trivial_casts                 = "warn"
trivial_numeric_casts         = "warn"
unused_import_braces          = "warn"
unused_lifetimes              = "warn"
unused_qualifications         = "warn"

# Lifetime / path hygiene — catches over-broad `pub`, implicit lifetimes in
# paths, and `'a: 'b` bounds that the compiler could infer.
unreachable_pub                = "warn"
single_use_lifetimes           = "warn"
elided_lifetimes_in_paths      = "warn"
redundant_lifetimes            = "warn"
explicit_outlives_requirements = "warn"

# Misc quality gates.
let_underscore_drop        = "warn"  # `let _ = ...` silently drops Drop types
keyword_idents_2024        = "warn"  # 2024-edition reserved keywords as idents
# Kept stricter than aozora on purpose: the sibling parser `allow`s this for
# a token enum whose largest variant trips the heuristic; aozora-flavored-markdown has no
# such enum, so we keep the `warn` and `Box` large variants if one appears.
variant_size_differences   = "warn"  # large enum variants — push to `Box`
ambiguous_negative_literals = "warn" # `-1.pow(2)` precedence traps

# `deny` so a plain `cargo build` (no `-D warnings`) also hard-fails on
# unreferenced items, keeping stale scaffolding from piling up.
dead_code = "deny"

# Warn on edition-drift so we catch idioms deprecated by the next edition early.
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
# Docs are a shipped surface: all rustdoc lints are `deny` (matches aozora).
broken_intra_doc_links       = "deny"
private_intra_doc_links      = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags            = "deny"
invalid_rust_codeblocks      = "deny"
bare_urls                    = "deny"
redundant_explicit_links     = "deny"
unescaped_backticks          = "deny"

[workspace.lints.clippy]
# Opt-in to all three lint groups that mainstream Rust libraries ship with.
# `priority = -1` lets specific carve-outs below override individual lints.
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

# Specific high-value promotions — catch bugs that routinely slip past default
# clippy. Tests are exempted from unwrap/expect/panic via clippy.toml so these
# only bite production code paths.
dbg_macro           = "warn"  # ban forgotten `dbg!` drops
todo                = "warn"
unimplemented       = "warn"
unwrap_used         = "warn"
expect_used         = "warn"
panic               = "warn"
print_stdout        = "warn"
print_stderr        = "warn"
clone_on_ref_ptr    = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc     = "warn"
missing_assert_message     = "warn"
# Promoted out of the carve-out list below, where it had sat since before the
# crate it was justified by stopped existing. It is the lint that owns
# `ir::IrBlock`: a stuttering name is invisible to the compiler, to the
# formatter and to every test, so with this off nothing in the workspace could
# see six of them at once. It reads re-exports too, which is how these types
# reach a consumer — the report lands on the `pub use` line in `ir/mod.rs`.
module_name_repetitions    = "warn"

# Hand-picked clippy::restriction lints (the full group has contradictory
# lints, so it stays off).
str_to_string                    = "warn"  # prefer `.into()` / `String::from`
absolute_paths                   = "warn"  # prefer `use`-imported names
allow_attributes_without_reason  = "warn"
empty_structs_with_brackets      = "warn"
if_then_some_else_none           = "warn"  # prefer `.then_some` / `.then`
let_underscore_must_use          = "warn"  # ignoring `#[must_use]` via `let _ =`
mixed_read_write_in_expression   = "warn"
rest_pat_in_fully_bound_structs  = "warn"
same_name_method                 = "warn"
semicolon_outside_block          = "warn"
try_err                          = "warn"  # prefer `?` over `Err(x)?`
unneeded_field_pattern           = "warn"
verbose_file_reads               = "warn"  # prefer `fs::read` / `fs::read_to_string`
format_push_string               = "warn"  # prefer `write!` / collect
unnecessary_self_imports         = "warn"
assertions_on_result_states      = "warn"  # prefer `.unwrap_err()` / explicit shape
filetype_is_file                 = "warn"
rc_buffer                        = "warn"  # `Rc<String>` → `Rc<str>`, etc.
rc_mutex                         = "warn"  # `Rc<Mutex<_>>` is a smell — threaded vs refcounted mix-up
lossy_float_literal              = "warn"
suspicious_xor_used_as_pow       = "warn"  # `2 ^ 10` is 8, not 1024

# Justified carve-outs.
multiple_crate_versions = "allow" # transitive dep collisions are not our problem
missing_const_for_fn    = "allow" # zero-arg builders read clearer as fns
redundant_pub_crate     = "allow" # conflicts with rustc's `unreachable_pub` (our source of truth)
use_self                = "allow" # IR enums spell recursive fields `Vec<Block>` / `Vec<Inline>`, not `Vec<Self>`, so `tsify` emits valid TS type names instead of `Self[]` (ADR-0017)

[workspace.dependencies]
aozora-flavored-markdown = { version = "0.5.0", path = "crates/aozora-flavored-markdown" }
# Test-only dev-dependency; `publish = false`. Path-only (no version) so
# `cargo publish` strips it from the published manifest — it is never on
# crates.io. The resulting `*` path requirement is permitted by deny.toml's
# `allow-wildcard-paths` (ADR-0015).
aozora-flavored-markdown-test-support = { path = "crates/aozora-flavored-markdown-test-support" }

# Sibling 青空文庫記法 parser. Depend on the umbrella `aozora` crate only, not
# its internal build-block crates, so aozora-flavored-markdown is insulated from its decomposition.
# Registry dependency (crates.io) so aozora-flavored-markdown can itself be published — a
# git source would make `cargo publish` reject the crate (ADR-0015). An
# intentional sync is one PR per `cargo xtask aozora-bump <version>`.
# `default-features = false` keeps json / schema / pandoc / fmt out of the
# build graph; the wasm crate opts into `json` on its own.
aozora = { version = "0.5.0", default-features = false }

# CommonMark + GFM engine, from crates.io (ADR-0024). One build graph locally,
# in CI and after publication; `Cargo.lock` carries the checksum cargo verifies
# on every build. `default-features = false` drops the comrak CLI
# (`cli` / `syntect` / `bon`); aozora-flavored-markdown-cli is our own binary.
comrak = { version = "0.54.0", default-features = false }

# Error handling
thiserror = "2.0.18"
anyhow    = "1.0"
# Feature-minimal on purpose: inheritance unions features, so a member can
# only ever widen this entry. The library implements the `Diagnostic` trait
# and needs nothing else; `derive` and the graphical `fancy` renderer are
# opted into by the members that report with them.
miette    = { version = "7.6.0", default-features = false }

# Parsing helpers
regex                 = "1.12"
similar               = "3.1"

# Serialization / data
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8.35"

# WASM / TypeScript bindings. Feature-gated: only aozora-flavored-markdown-wasm
# and the lib's `tsify` feature pull these. `tsify` derives the
# playground / obsidian `.d.ts` straight from the Rust IR + envelope types,
# so the TypeScript surface can't drift from the Rust shape — replacing the
# former hand-written xtask codegen (ADR-0017). `js` = serde-wasm-bindgen ABI.
wasm-bindgen = "0.2"
# The harness `just test-wasm` (`wasm-pack test --node`) collects. Only
# `#[wasm_bindgen_test]` functions run under it, and only on wasm32 — which is
# the point: the exports it reaches are the ones a host-target test cannot,
# starting with the `web-sys` clock behind `profileJson`.
wasm-bindgen-test = "0.3"
tsify   = { version = "0.5.6", default-features = false, features = ["js"] }

# Observability
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4.6.1", features = ["derive", "wrap_help", "env", "color", "cargo"] }
clap_complete = "4.6"
clap_mangen   = "0.3"

# Testing
proptest          = "1.11"
pretty_assertions = "1.4.1"
# Snapshot testing
insta             = "1.47"

# Benchmarking / profiling
criterion = { version = "0.8", features = ["html_reports"] }
dhat      = "0.3"

# EPUB output. Consumed only by aozora-flavored-markdown-epub (+ its CLI),
# consolidated from the former sibling repo (ADR-0018). The pure parser /
# renderer crates never pull these — they stay isolated in the epub crate.
quick-xml = { version = "0.41", features = ["serialize"] }
zip       = { version = "8", default-features = false, features = ["deflate"] }
uuid      = { version = "1", features = ["v4"] }
chrono    = { version = "0.4", features = ["serde"] }
toml      = "1.1"
tempfile  = "3"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
opt-level     = 3

[profile.bench]
inherits = "release"
strip    = "none"
debug    = 1

[profile.dev]
# Faster incremental rebuilds: debug info stays in .o files instead of being
# packed into every binary.
split-debuginfo = "unpacked"

# Optimise proc-macros/build scripts/most upstream in dev to speed the test cycle
[profile.dev.package."*"]
opt-level = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
