# zizmor (https://docs.zizmor.sh) — static analysis for this repo's GitHub
# Actions, run by `just zizmor` as a `just ci` / ci.yml lint gate.
#
# This file is where the action-pinning rule LIVES. It used to be a sentence in
# ci.yml's header comment ("Action SHAs are pinned"), and a sentence is a rule
# nothing evaluates: four `uses:` had drifted onto floating tags — a moving
# `@v4`, a moving `@v2`, a mutable `@v7.0.1`, a branch `@stable` — with every
# gate green. `unpinned-uses` below is the same rule as something that fails a
# build.

rules:
  unpinned-uses:
    config:
      policies:
        # Every action, first- and third-party alike, is referenced by its
        # 40-hex commit. The `# vX.Y.Z` next to a ref is a comment for humans
        # and for Dependabot, never the thing GitHub resolves — a tag is
        # mutable, so a tag pin is an authorisation for its owner to change
        # what runs in this repo. `*` is a blanket on purpose: a `uses:` added
        # tomorrow, to an action nobody has listed here, is covered the moment
        # it is written.
        "*": hash-pin

  # `.github/workflows/release.yml` is GENERATED by cargo-dist and has to match
  # the generator byte for byte — `dist plan` runs on every PR and fails on any
  # hand edit (CONTRIBUTING.md, "Releasing"). A finding inside it is therefore
  # not actionable here; the fix belongs upstream in cargo-dist. Suppressed per
  # audit rather than per file so `unpinned-uses` still covers it: its action
  # refs ARE this repo's to choose, pinned by `[dist.github-action-commits]` in
  # dist-workspace.toml.
  template-injection:
    ignore:
      - release.yml
  excessive-permissions:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml

  # Dependabot cooldown windows hold every version update back N days so a
  # freshly-published malicious release is never the one that lands. That is a
  # change to when this repo takes dependencies, not to how its workflows are
  # written, so it is a decision to make deliberately rather than a side effect
  # of turning this gate on. Recorded here, where the next reader meets it,
  # instead of rediscovered by the next person who runs zizmor.
  dependabot-cooldown:
    ignore:
      - dependabot.yml
