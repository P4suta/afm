# Retired upstream names, each an *internal* path this workspace once reached
# into and which no longer exists. The sibling parser publishes a small,
# deliberately curated API; prose naming anything else has already rotted,
# because it teaches a reader an import that cannot compile. The remedy is
# always the same: describe the behaviour, not the upstream internal that
# provides it (ADR-0021).
#
# `[-_]` is not decoration. Rust writes the same crate two ways — hyphenated
# in a manifest, underscored in an intra-doc link — and the underscored
# spelling is where the drift accumulates, because a link to a dependency that
# has gone away is what turns `just doc` red. One token covers both.
extends: existence
message: "'%s' is a retired upstream path — describe the behaviour instead (ADR-0021)."
level: error

# The whole file, markup included, rather than the prose Vale would hand a
# style rule by default.
#
# Default scope drops what Markdown calls code, and a crate name in a Markdown
# document is written in backticks essentially always — so the one spelling
# this rule most needs to see in the one file kind it was added for was the
# spelling it could not see. A fenced example is the same case twice over: an
# `use` line in a README teaches an import that cannot compile, which is this
# rule's whole subject, and no compiler will ever read it.
#
# The cost is that real Rust code is in scope too, where the deleted scanner
# deliberately left it to the compiler. That trade is nearly free: a retired
# path in code does not compile, so what `raw` actually adds there is the
# string literal and the commented-out line, both of which rot exactly like
# prose. `the_prose_gate_still_fails_on_a_retired_name_in_a_comment` measures
# both halves, and
# `the_prose_gate_fails_on_a_retired_name_in_a_document` measures the Markdown
# rows this scope buys.
scope: raw
tokens:
  - 'aozora::pipeline'
  - 'aozora::syntax'
  - 'aozora::render'
  - 'aozora::encoding'
  - 'aozora[-_]pipeline'
  - 'aozora[-_]syntax'
  - 'aozora[-_]render'
  - 'aozora[-_]encoding'
  - 'aozora[-_]proptest'
  - 'aozora[-_]spec'
  - 'aozora[-_]corpus'
  - 'aozora[-_]lexer'
  - 'aozora[-_]parser'
  - 'aozora[-_]scan'
  - 'lex[-_]into[-_]arena'
  - 'node[-_]at[-_]normalized'
  - 'render[-_]node'
  - 'BorrowedLexOutput'
  - 'NormalizedOffset'
  - 'AozoraNode'
