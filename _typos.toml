# typos (https://github.com/crate-ci/typos) configuration
# Named `_typos.toml` so it doesn't shadow Cargo features matching on `typos.*`.

[default]
# Honorary words unique to this project / domain.
extend-ignore-identifiers-re = [
    "[A-Fa-f0-9]{7,}",   # git SHAs in comments
    # `zip::ZIP64_BYTES_THR` — the archiver's own name for the classic entry
    # size limit, spelled by upstream and not ours to rename.
    "ZIP64_BYTES_THR",
]

[default.extend-words]
# Intentional. Japanese transliteration shouldn't trigger English typo heuristics.
aozora-flavored-markdown = "aozora-flavored-markdown"
# EPUB packaging abbreviations (aozora-flavored-markdown-epub): OPF = Open
# Packaging Format, NCX = legacy navigation document. Not English words.
opf = "opf"
ncx = "ncx"
# French fragments in Aozora accent-decomposition examples (e.g. funèbre).
bre = "bre"
# Proper names from NOTICE / docs (listed, not suppressed, so nearby typos still catch).
kivikakk    = "kivikakk"
Asherah     = "Asherah"
Connor      = "Connor"
MacFarlane  = "MacFarlane"
Dostoyevsky = "Dostoyevsky"
Fyodor      = "Fyodor"
Yonekawa    = "Yonekawa"
Masao       = "Masao"
Dubost      = "Dubost"
Yasunobu    = "Yasunobu"

[files]
extend-exclude = [
    "spec/aozora/fixtures/", # Aozora Bunko source files
    "spec/sources/",         # vendored upstream spec sources (CommonMark/GFM)
    "crates/aozora-flavored-markdown/spec/*.json", # generated fixtures
    # Fuzz seeds copy the excluded upstream spec text, while the rest of a
    # corpus directory is libFuzzer-generated bytes.
    "crates/*/fuzz/corpus/",
    "target/",
    "coverage/",
    "*.lock",
]
