[package]
name        = "aozora-flavored-markdown-cli"
description = "Aozora Flavored Markdown (aozora-flavored-markdown): command-line interface"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true

# This crate's own README — an inherited `readme` resolves against the
# WORKSPACE root, which is how all four crates.io pages came to be the same
# repository landing page. See the library's manifest.
readme = "README.md"

# The CLI integration suite is this repository's, not a consumer's. See the
# library's manifest for the licence symlinks beside this file.
exclude = ["tests/"]

# Same docs.rs build as the library (see its manifest for why). docs.rs itself
# documents nothing here — for a crate with no lib target it answers
# "<name>-<version> is not a library" and builds nothing, as it does for
# ripgrep and as it does for the published 0.4.1 of this crate. So the table is
# inert today, and is kept for the day the crate grows a lib target:
# every published member declares the same build, which is the property
# `every_crate_this_repo_publishes_declares_the_docs_rs_build_it_wants` holds,
# and a table added later is a table someone has to remember.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Step 2 of the manual release, made a consequence of the bump instead of
# something to remember after it. `dist/assets/man/aozora-flavored-markdown.1`
# is generated from this binary's clap definition and embeds the version in two
# places, so every bump invalidates it and `just dist-assets-check` — a gate —
# goes red on the release commit itself.
#
# Declared on THIS package because it is this package's man page: cargo-release
# runs the hook once per selected package, and a hook that regenerates a CLI's
# assets has no business firing for the wasm bridge or for xtask. The recipe is
# reached through `just`, which walks up to the workspace Justfile and runs
# from there, so the hook's working directory (this crate) does not matter.
#
# `bun install` is deliberately NOT here. `playground/bun.lock` was expected to
# drift on a version bump — the wasm `pkg/package.json` it links to by `file:`
# carries the workspace version — but measured at the pinned bun (1.3.14,
# lockfile v1) it does not: the lockfile records that dependency as a path with
# no version, and `bun install --frozen-lockfile` passes with the two out of
# step. See `just playground-install`.
[package.metadata.release]
pre-release-hook = ["just", "dist-assets"]

[lints]
workspace = true

[[bin]]
name = "aozora-flavored-markdown"
path = "src/main.rs"
# rustdoc names a target's output directory after the target, underscored: this
# bin and the `aozora-flavored-markdown` LIBRARY both write
# `target/doc/aozora_flavored_markdown/`. `cargo doc --workspace` builds them in
# one pass, so the second unit to finish overwrote the first — cargo says so
# ("output filename collision"), and the API site the `docs` workflow copies out
# of `target/doc` was serving whichever won the race. That is the library's own
# URL, which `[workspace.package] documentation` points every reader at.
#
# `doc = false` over the alternatives (a second output directory, or a
# per-crate build) because the bin's page has no reader to lose: docs.rs does
# not build it (see above), and on the Pages site it existed only by displacing
# the library's. The binary's own name is the shipped command and cannot be
# renamed to dodge the clash. The cost is that rustdoc no longer runs over this
# crate's `//!` and `///` comments, which are in-tree commentary on a binary's
# internals rather than a published surface; `_NO_COLLISION` in the Justfile is
# what stops the underlying clash from returning unnoticed.
doc = false

[dependencies]
aozora          = { workspace = true }
# `miette`: the library's own `Diagnostic` implements miette's trait, so this
# binary reports what a render saw directly instead of copying it into a
# shadow type it then has to keep in step.
# `serde`: `--format json` serialises `Severity` / `DiagnosticSource` / `Span`
# straight into the `aozora-md.diagnostics.v1` envelope (ADR-0012), so the
# library's own derives are what the binary writes.
aozora-flavored-markdown    = { workspace = true, features = ["miette", "serde"] }
clap      = { workspace = true }
clap_complete = { workspace = true }
clap_mangen   = { workspace = true }
# `fancy` is the graphical handler `install_diagnostic_hook` configures.
miette    = { workspace = true, features = ["fancy"] }
tracing-subscriber = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
similar    = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
