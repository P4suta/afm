[package]
name          = "aozora-flavored-markdown-epub-cli"
version       = "0.1.0"            # independent of the workspace 0.4.x line (ADR-0018)
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
description   = "CLI front-end for the aozora-flavored-markdown-epub library"
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
authors       = { workspace = true }
keywords      = ["epub", "epub3", "markdown", "aozora", "japanese"]
categories    = ["command-line-utilities"]

# This crate's own README — an inherited `readme` resolves against the
# WORKSPACE root. See the library's manifest.
readme  = "README.md"

# The CLI integration suite is this repository's, not a consumer's. See the
# library's manifest for the licence symlinks beside this file.
exclude = ["tests/"]

# Binary distribution via cargo-dist is deferred: the epub CLI is independently
# versioned (0.1.x) and not yet part of the workspace's cargo-dist release
# (ADR-0018). It still publishes to crates.io as an ordinary crate.
[package.metadata.dist]
dist = false

# Same docs.rs build as the library (see its manifest for why), and inert for
# the same reason as the other CLI's: docs.rs documents no crate without a lib
# target.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[bin]]
name = "aozora-flavored-markdown-epub"
path = "src/main.rs"
# The same collision as the other CLI, one crate over: this bin and the
# `aozora-flavored-markdown-epub` library both document into
# `target/doc/aozora_flavored_markdown_epub/`, so the Pages API site served
# whichever unit finished last. See that manifest for why `doc = false` rather
# than a separate output directory.
doc = false

[dependencies]
aozora-flavored-markdown-epub = { version = "0.1.0", path = "../aozora-flavored-markdown-epub" }
# `miette`: the renderer's `Diagnostic` implements miette's trait, so a
# chapter diagnostic is reported as itself rather than through a shadow type.
# `serde`: `--format json` serialises `Severity` / `DiagnosticSource` / `Span`
# into the `aozora-md.diagnostics.v1` envelope (ADR-0012).
aozora-flavored-markdown = { workspace = true, features = ["miette", "serde"] }
clap      = { workspace = true }
# `fancy` is the graphical handler that renders a report on the terminal.
miette    = { workspace = true, features = ["fancy"] }
serde      = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile  = { workspace = true }
