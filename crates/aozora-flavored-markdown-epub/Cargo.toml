[package]
name          = "aozora-flavored-markdown-epub"
version       = "0.1.0"            # independent of the workspace 0.4.x line (ADR-0018)
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
description   = "Library API for converting Aozora Flavored Markdown into an EPUB3 package"
repository    = { workspace = true }
homepage      = { workspace = true }
authors       = { workspace = true }
readme        = { workspace = true }
keywords      = ["epub", "epub3", "markdown", "aozora", "japanese"]
categories    = ["text-processing"]

[lints]
workspace = true

[dependencies]
# `theme`: the canonical `aozora-md-*` stylesheets as `pub const` strings.
# The crate that emits the classes owns their CSS, so the EPUB bundles it
# through a normal crate dependency instead of vendoring a copy that has to
# track the class contract by hand (ADR-0020).
aozora-flavored-markdown = { workspace = true, features = ["theme"] }
aozora                   = { workspace = true }
miette          = { workspace = true }
thiserror       = { workspace = true }
serde           = { workspace = true }
toml            = { workspace = true }
quick-xml       = { workspace = true }
zip             = { workspace = true }
uuid            = { workspace = true }
chrono          = { workspace = true }

[dev-dependencies]
insta             = { workspace = true }
tempfile          = { workspace = true }
zip               = { workspace = true }
