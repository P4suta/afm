[package]
name          = "aozora-flavored-markdown-epub"
version       = "0.1.0"            # independent of the workspace 0.4.x line (ADR-0018)
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
description   = "Library API for converting Aozora Flavored Markdown into an EPUB3 package"
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
authors       = { workspace = true }
keywords      = ["epub", "epub3", "markdown", "aozora", "japanese"]
categories    = ["text-processing"]

# This crate's own README — an inherited `readme` resolves against the
# WORKSPACE root, so this crate's crates.io page was the repository landing
# page, which does not contain the word EPUB. See the library's manifest.
readme  = "README.md"

# The build suite is this repository's, not a consumer's. `examples/sample/` —
# a whole manuscript and its `book.toml` — stays in: it is what the README
# points at. See the library's manifest for the licence symlinks beside this
# file.
exclude = ["tests/"]

# Same docs.rs build as the library (see its manifest for why).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
# `theme`: the canonical `aozora-md-*` stylesheets as `pub const` strings.
# The crate that emits the classes owns their CSS, so the EPUB bundles it
# through a normal crate dependency instead of vendoring a copy that has to
# track the class contract by hand (ADR-0020).
aozora-flavored-markdown = { workspace = true, features = ["theme"] }
aozora                   = { workspace = true }
# Trait + derive only. `fancy` is the graphical renderer, which is a binary's
# choice to make: it belongs to whoever owns the terminal, so the CLI opts in
# and a library consumer reporting through something else pays nothing.
miette          = { workspace = true, features = ["derive"] }
thiserror       = { workspace = true }
serde           = { workspace = true }
toml            = { workspace = true }
quick-xml       = { workspace = true }
zip             = { workspace = true }
uuid            = { workspace = true }
chrono          = { workspace = true }

[dev-dependencies]
insta             = { workspace = true }
tempfile          = { workspace = true }
zip               = { workspace = true }
# `property_build_report.rs` states diagnostic preservation over drawn books
# rather than a fixed pool, so it needs the shared input strategies and the
# one `ProptestConfig` the workspace tunes. Both crates are dev-only and
# `publish = false` / test-scoped, so neither reaches a published build graph.
aozora-flavored-markdown-test-support = { workspace = true }
proptest                             = { workspace = true }
