[package]
name        = "aozora-flavored-markdown"
description = "Aozora Flavored Markdown: CommonMark + GFM + Aozora Bunko notation integrated in one dialect, built on comrak"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

[lints]
workspace = true

[dependencies]
# The sibling 青空文庫記法 parser, reached only through its published
# surface — `parse` / `Document` / `Snapshot` and the flat projection on
# top of them (ADR-0021). The crates it is built from are not published,
# so there is nothing else to depend on. See the workspace manifest.
aozora    = { workspace = true }
comrak    = { workspace = true }
# Used by the IR module to derive Serialize on `ir::Document`. Pulled
# in as a regular dep so downstream consumers (aozora-flavored-markdown-wasm, aozora-flavored-markdown-epub)
# can round-trip the IR via serde-wasm-bindgen / serde_json without
# extra adapters.
serde     = { workspace = true }
# `Error`, the one fallible entry point's error type (`canonicalize`). The
# rendering entry points stay infallible, so nothing else in the crate has a
# `Result` for this to describe.
thiserror = { workspace = true }
# Feature-gated TypeScript-binding derives. The `tsify` feature (enabled only
# by aozora-flavored-markdown-wasm) makes the IR + diagnostic types derive
# `tsify::Tsify`, so wasm-pack emits their `.d.ts` directly — no separate
# codegen step (ADR-0017). Off by default, so host builds (CLI / epub / tests)
# never pull wasm-bindgen.
tsify   = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
# Invariant predicates, plus the proptest input strategies and shared config
# (`aozora_flavored_markdown_test_support::{config, generators}`). It is a
# dev-dependency, so the normal build graph stays free of proptest.
aozora-flavored-markdown-test-support = { workspace = true }
proptest          = { workspace = true }
pretty_assertions = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
criterion         = { workspace = true }
dhat              = { workspace = true }
# Snapshot assertions for the post-splice HTML golden tests
# (`tests/snapshot_splice.rs`).
insta             = { workspace = true }

[features]
default = ["html"]
# HTML renderer. Enabled by default but kept behind a feature so
# downstream tools can parse without pulling in the renderer.
html = []
# TypeScript-binding derives (see `tsify` / `wasm-bindgen` above).
# Enabled by aozora-flavored-markdown-wasm so wasm-pack emits the IR +
# diagnostic `.d.ts` directly (ADR-0017). Off by default — host builds
# never pull wasm-bindgen.
tsify = ["dep:tsify", "dep:wasm-bindgen"]
# The canonical `aozora-md-*` stylesheets as `pub const` strings
# (`theme::{HORIZONTAL_CSS, VERTICAL_CSS}`), embedded from this crate's
# `theme/` directory. Pure data, no dependencies — off by default so a
# parser-only consumer doesn't carry ~20 KiB of CSS. Enabled by
# aozora-flavored-markdown-epub, which bundles a theme into the EPUB it
# writes instead of vendoring its own copy (ADR-0020).
theme = []

[package.metadata.cargo-shear]
# `wasm-bindgen` is pulled by the `tsify` feature and used only by the code
# `tsify::Tsify` expands into (no source-level `use`), so cargo-shear's
# `syn` pass can't see it. It is genuinely required whenever `tsify` is on.
ignored = ["wasm-bindgen"]

[[bench]]
name    = "render_to_string"
harness = false

[[bench]]
name    = "splice"
harness = false
