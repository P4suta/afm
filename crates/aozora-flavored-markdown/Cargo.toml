[package]
name        = "aozora-flavored-markdown"
description = "Aozora Flavored Markdown: CommonMark + GFM + Aozora Bunko notation integrated in one dialect, built on comrak"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true

# This crate's own README, not the workspace root's. An inherited `readme` is
# resolved relative to the WORKSPACE root, so `readme.workspace = true` shipped
# the repository landing page in all four tarballs — which is how the EPUB
# crate's crates.io page came to say nothing about EPUB, and how every relative
# link in it came to 404 from a page that is not on GitHub.
readme = "README.md"

# What the tarball carries beside the source, and what it does not.
#
# Beside it: the README above, and the `LICENSE-APACHE` / `LICENSE-MIT` /
# `NOTICE` files next to this manifest. Those three are symlinks to the
# workspace root's, because `license` above is an SPDX expression and cargo
# carries no text with it — until they existed, no tarball this workspace
# published held a word of either licence. Symlinks rather than copies: cargo
# dereferences them into the archive, so a consumer gets the text, and there is
# no second copy in the tree to drift from the original.
#
# Not: the integration suite, benchmarks and fuzz targets. The explicit
# include list keeps the crate payload readable while carrying the generated
# CommonMark/GFM fixtures needed by its unit tests.
include = [
    "src/**",
    "examples/**",
    "theme/**",
    "spec/*.json",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "NOTICE",
]

# docs.rs otherwise builds default features only, and every feature here is off
# by default — so the published page would omit `theme`'s stylesheets, the
# `serde` derives and the `miette` impl, which is most of what a reader is
# there to check. `just doc-public` is the local equivalent and already passes
# `--all-features`, so this is what keeps the two builds asking the same
# question. `--cfg docsrs` is the flag that identifies the docs.rs build to
# rustdoc; no `cfg(docsrs)` is read in `src/` today, and it is set here so an
# item that later wants a feature badge does not need a manifest change to get
# one.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Cutting `## [Unreleased]` into a dated section, which was step 1 of the
# manual release and the step most likely to be skipped.
#
# It is declared HERE, on one package, rather than in `release.toml` where the
# rest of the policy is, and that placement is load-bearing: cargo-release runs
# `pre-release-replacements` once per selected package, and this workspace has
# one CHANGELOG for all seven of them. Declared workspace-wide, the first pass
# would cut the section and the second would cut the freshly emptied
# `## [Unreleased]` the first pass had just written — `exactly = 1` matches
# either way, because a fresh one is there to match. This is the package the
# file is about: the library the workspace is named after, whose version is the
# one the heading and the `v<version>` tag carry.
#
# `file` resolves against this directory, hence `../..`. The searches are
# regular expressions in multi-line mode, and they run in the order written:
# the two that consume `[Unreleased]` come before the two markers that write a
# new one, or the new one would be consumed as well.
#
# Anchored, rather than cargo-release's own documented `search = "Unreleased"`
# over the whole file. A third `[Unreleased]` lives in this CHANGELOG's history
# — the 0.4.0 section says "see [Unreleased]" about a splicer that shipped —
# and the unanchored form would rewrite that sentence into a cross-reference to
# a release it predates.
[package.metadata.release]
pre-release-replacements = [
    # The section heading becomes this version's, dated.
    { file = "../../CHANGELOG.md", search = "(?m)^## \\[Unreleased\\]$", replace = "## [{{version}}] - {{date}}", exactly = 1 },
    # Its link definition, and the compare range that definition points at:
    # `compare/v0.5.0...HEAD` is what "unreleased" means as a URL, and the
    # released form ends at the tag instead.
    { file = "../../CHANGELOG.md", search = "(?m)^\\[Unreleased\\]: ", replace = "[{{version}}]: ", exactly = 1 },
    { file = "../../CHANGELOG.md", search = "(?m)\\.\\.\\.HEAD$", replace = "...v{{version}}", exactly = 1 },
    # A fresh, empty `## [Unreleased]` and its link definition, so the next
    # cycle has somewhere to write and the one after it has this same shape to
    # find. The markers are HTML comments: invisible in the rendered file, and
    # the only thing in it that this configuration needs to be true.
    { file = "../../CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n\n## [Unreleased]", exactly = 1 },
    { file = "../../CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[Unreleased]: https://github.com/P4suta/aozora-flavored-markdown/compare/v{{version}}...HEAD", exactly = 1 },
]

[lints]
workspace = true

[dependencies]
# The sibling 青空文庫記法 parser, reached only through its published
# surface — `parse` / `Document` / `Snapshot` and the flat projection on
# top of them (ADR-0021). The crates it is built from are not published,
# so there is nothing else to depend on. See the workspace manifest.
aozora    = { workspace = true }
comrak    = { workspace = true }
# Optional: `Serialize` + `Deserialize` on the IR and the diagnostic
# envelope, behind the `serde` feature below. Off by default so a consumer
# that renders HTML and never touches JSON does not build serde at all — the
# sibling `aozora` crate draws the same line with its `json` feature.
serde     = { workspace = true, optional = true }
# `CanonicalizeError`, the one fallible entry point's error type
# (`canonicalize`). The
# rendering entry points stay infallible, so nothing else in the crate has a
# `Result` for this to describe.
thiserror = { workspace = true }
# Feature-gated TypeScript-binding derives. The `tsify` feature (enabled only
# by aozora-flavored-markdown-wasm) makes the IR + diagnostic types derive
# `tsify::Tsify`, so wasm-pack emits their `.d.ts` directly — no separate
# codegen step (ADR-0017). Off by default, so host builds (CLI / epub / tests)
# never pull wasm-bindgen.
tsify   = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
# The `miette` feature's one dependency: `impl miette::Diagnostic for
# Diagnostic`, so a host reports what a render saw through miette instead of
# re-deriving a shadow type. Trait only — the graphical `fancy` renderer is a
# binary's choice, so the two CLIs opt into it and this crate never does.
miette  = { workspace = true, optional = true }

[dev-dependencies]
# Invariant predicates, plus the proptest input strategies and shared config
# (`aozora_flavored_markdown_test_support::{config, generators}`). It is a
# dev-dependency, so the normal build graph stays free of proptest.
aozora-flavored-markdown-test-support = { workspace = true }
proptest          = { workspace = true }
pretty_assertions = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
encoding_rs       = { workspace = true }
criterion         = { workspace = true }
dhat              = { workspace = true }
# Snapshot assertions for the post-splice HTML golden tests
# (`tests/snapshot_splice.rs`).
insta             = { workspace = true }
# `conformance::canonical_xml`, which is how the two GFM task-list examples
# are compared: their expected output differs from comrak's in attribute
# order and self-closing style and in nothing else, so the runner compares
# the two as XML rather than skipping them. A hand-rolled tag scanner is the
# almost-right parser this workspace already keeps out of its source, and the
# EPUB crate reads and writes its XML through this same crate.
quick-xml         = { workspace = true }

[features]
# No `default`: the former `html` feature gated nothing (zero
# `#[cfg(feature = "html")]` in the workspace) and could not — `ir::Block::Aozora`
# carries rendered HTML, so a build without the renderer was never buildable.

# `Serialize` + `Deserialize` on the IR, `Diagnostic` and the geometry
# types. ADR-0012 and ADR-0017 call the `aozora-md.diagnostics.v1` envelope
# and the IR a stable wire format, so both directions are derived together:
# a format only one side can read is a dead letter, and the `#[serde(default)]`
# beside every `skip_serializing_if` is what makes the pair a round trip.
serde = ["dep:serde"]
# TypeScript-binding derives (see `tsify` / `wasm-bindgen` above).
# Enabled by aozora-flavored-markdown-wasm so wasm-pack emits the IR +
# diagnostic `.d.ts` directly (ADR-0017). Off by default — host builds
# never pull wasm-bindgen. Implies `serde`: `tsify` reads the same
# `#[serde(…)]` attributes to decide the TS shape, and the ABI it generates
# is serde's.
tsify = ["dep:tsify", "dep:wasm-bindgen", "serde"]
# The canonical `aozora-md-*` stylesheets as `pub const` strings
# (`theme::{HORIZONTAL_CSS, VERTICAL_CSS}`), embedded from this crate's
# `theme/` directory. Pure data, no dependencies — off by default so a
# parser-only consumer doesn't carry ~20 KiB of CSS. Enabled by
# aozora-flavored-markdown-epub, which bundles a theme into the EPUB it
# writes instead of vendoring its own copy (ADR-0020).
theme = []
# `impl miette::Diagnostic for Diagnostic`. Off by default: `Display` and
# `Error` are unconditional, and a consumer that reports through anything
# else should not pay for miette to get them.
miette = ["dep:miette"]

[package.metadata.cargo-shear]
# `wasm-bindgen` is pulled by the `tsify` feature and used only by the code
# `tsify::Tsify` expands into (no source-level `use`), so cargo-shear's
# `syn` pass can't see it. It is genuinely required whenever `tsify` is on.
ignored = ["wasm-bindgen"]

[[bench]]
name    = "render"
harness = false

[[bench]]
name    = "splice"
harness = false
