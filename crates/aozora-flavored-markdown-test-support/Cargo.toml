[package]
name        = "aozora-flavored-markdown-test-support"
description = "Test predicates and invariant helpers for the aozora-flavored-markdown integration test suite"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true
publish              = false

[lints]
workspace = true

[dependencies]
# The test-support library carves up aozora-flavored-markdown's emitted HTML
# without parsing the source itself. Its one production-side dependency is the
# library whose output it checks, so the two contracts the predicates read —
# the PUA sentinel set (`sentinels::ALL`) and the `aozora-md-*` class list
# (`classes::all()`) — come from the crate that owns them instead of being
# re-hardcoded here. The edge is dev-only in the other direction (the library
# reaches this crate through `[dev-dependencies]`), so no cycle reaches a
# published build graph.
aozora-flavored-markdown = { workspace = true }
# Input strategies (`generators`) and the shared `ProptestConfig` (`config`)
# live here because this crate is `publish = false` and reached only through
# `[dev-dependencies]`. proptest therefore never enters the runtime graph of
# any published crate.
proptest = { workspace = true }
