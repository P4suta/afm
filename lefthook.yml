# Pre-commit / pre-push hooks — every command runs in the dev container via
# `just` (ADR-0002). Enable with `just hooks`, disable with `just hooks-uninstall`.
# Reference: https://lefthook.dev/configuration/
# `fail_text` on each command is the human hint shown on failure.

# Explicit output set so it survives lefthook default-set changes across versions.
output:
  - meta
  - summary
  - success
  - failure
  - execution
  - execution_info
  - execution_out
  - skips
  - empty_summary

pre-commit:
  parallel: true
  skip:
    - rebase
    - merge
  commands:
    # `cargo fmt --all` writes; fixes are re-staged so the commit carries them.
    fmt:
      glob: "*.rs"
      run: just fmt
      stage_fixed: true
      fail_text: |
        `cargo fmt` failed. Run `just fmt` manually to see the error.
        Common cause: rustfmt edition mismatch with rust-toolchain.toml.
    clippy:
      glob: "*.{rs,toml}"
      run: just clippy
      fail_text: |
        clippy reported an error. Re-run `just clippy` for the full
        diagnostic. Fix the code rather than silencing the lint.
    typos:
      run: just typos
      fail_text: |
        `typos` found a probable typo. Re-run `just typos`, or add an
        exception to `_typos.toml` if the token is intentional.
    # Biome (format + lint + import order) over the playground. Behind a glob
    # because it is the one hook that reaches for bun and wasm-pack: a commit
    # that touches no TypeScript should not pay for `playground-install`.
    # `just playground-test` is deliberately NOT here — it belongs to the
    # pre-push `just ci`, which runs the whole gate set.
    #
    # TWO patterns, because lefthook's `**` is not vite's or biome's. There it
    # spans zero directories or many, so `src/**/*.ts` covers `src/outline.ts`;
    # here it needs at least one, so `playground/**/*.{ts,tsx,json}` alone
    # covered `playground/src/…` and silently skipped every file at the top of
    # the directory — vite.config.ts, package.json, tsconfig.json, biome.json.
    # Those four are the gate's own configuration: the `--error-on-warnings`
    # that makes it fail, biome's rule set and its `files.includes`, and the
    # vitest `include`. A commit that turned the gate off was exactly a commit
    # this hook did not run on. Measured against lefthook 2.1.9 with
    # `lefthook run pre-commit --command playground --file <path>`, and held by
    # `the_pre_commit_hook_over_the_playground_fires_on_every_file_its_gate_reads`
    # in crates/xtask/tests/gate_wiring.rs.
    playground:
      glob:
        - "playground/*.{ts,json}"
        - "playground/**/*.{ts,tsx,json}"
      run: just playground-lint
      fail_text: |
        biome rejected the playground sources. `just playground-lint` prints
        the full diagnostic; `just playground-lint-fix` applies the safe half
        (formatting and import order) so what is left is the real finding.

commit-msg:
  commands:
    # Conventional Commits via `committed` (host-side; `{1}` is the message file).
    committed:
      run: committed --commit-file {1}

pre-push:
  # `just ci` runs the gates sequentially, cheap-to-expensive, so early ones
  # fail fast. It mirrors the CI jobs reachable inside the dev image.
  parallel: false
  skip:
    - rebase
  commands:
    ci:
      run: just ci
      fail_text: |
        `just ci` failed. The error is the last `error: recipe \`<name>\`
        failed ...` line above — it names the sub-recipe that bombed.
        Re-run `just ci` directly for unwrapped output.
    # Deep proptest sweep (4096 cases vs CI's 128). Opt out of an unrelated
    # aozora-core failure with `SKIP_TAGS=deep git push` and file an issue.
    prop-deep:
      run: just prop-deep
      tags:
        - deep
      fail_text: |
        Deep proptest regression. Re-run `just prop-deep` to reproduce.
        The failing seed is in nextest's PASS/FAIL line; pass it via
        `AOZORA_PROPTEST_SEED=<n>` to shrink locally.
