# Vale (https://vale.sh) — the prose half of this repo's drift gates, run by
# `just vale`.
#
# What it holds is one thing: a retired upstream path named in prose. That was
# `cargo xtask comment-discipline`'s job, and its file list was
# `[("rs", "//"), ("toml", "#")]` — so a `.md` file was outside every gate this
# repo has, and `UPSTREAM_DIFF.md` went stale in full with nothing to notice.
# Vale reads Markdown as prose and extracts comments from `.rs` natively, so
# one rule now covers both the case that gate held and the case it could not
# see, and the hand-written scanner is gone (DEV-221).
#
# What did NOT move here: the doc-comment volume ratchet, which is a count and
# not a rule about words, and the retired *repo* path scan. `just vale` does
# hand Vale every file git tracks, `.gitattributes` and CODEOWNERS included,
# but what Vale reads in one is the prose — a `linguist-vendored` glob and a
# CODEOWNERS owner are neither prose nor comments, and a retired repo path is
# a fact about the filesystem rather than a rule about words. Both stay in
# `crates/xtask/src/main.rs`.

StylesPath = styles

# `error` is the only level the rule below uses, and reaching it is what makes
# Vale exit non-zero. Nothing here is advisory.
MinAlertLevel = error

[*]
BasedOnStyles = Aozora

# Where a retired name is a record rather than drift. The changelog says what
# was removed and a decision record says why; both are dated documents, and
# rewriting them to keep a lint quiet would delete the only account of the
# decision. It is why ADR-0024 amends ADR-0015's `comrak` source bullet by
# reference instead of editing it.
[{CHANGELOG.md,docs/adr/*}]
Aozora.RetiredPaths = NO

# The rule file necessarily spells every token it bans, so it cannot be held
# to its own rule. This is load-bearing rather than defensive: `just vale`
# hands Vale every tracked file, this one among them. It is the same exclusion
# `RETIRED_PATH_LIST_FILE` makes in `crates/xtask/src/main.rs`, for the same
# reason, and the two are compared by
# `the_documents_the_prose_gate_excuses_are_the_ones_the_path_gate_excuses`.
[styles/**]
Aozora.RetiredPaths = NO
