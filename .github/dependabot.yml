version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 20
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    # release.yml is hand-maintained around cargo-dist. Keep its immutable
    # action refs paired with dist-workspace.toml instead of accepting an
    # automated edit to only one copy.
    exclude-paths:
      - ".github/workflows/release.yml"
    # Keep SHA pins fresh; human-readable tag comments are updated automatically.
    groups:
      actions-sha-bumps:
        patterns: ["*"]
