version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 20
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # `.github/workflows/release.yml` is a cargo-dist GENERATED file: its whole
    # contents come from the generator pinned as `cargo-dist-version` in
    # `dist-workspace.toml`, and every PR runs `dist plan`, which fails the
    # build when the committed file differs from what that generator emits. A
    # Dependabot edit inside it is therefore permanently red (#143 raised
    # `actions/checkout` v6 → v7 against a generator that emits v6), so the
    # file is excluded here. Every hand-written workflow stays in scope.
    #
    # This is NOT an exemption from the repo's SHA-pinning rule. The action
    # refs in release.yml are pinned by `[dist.github-action-commits]` in
    # `dist-workspace.toml`, which overrides each ref with an immutable commit
    # before the template renders — so the generated file carries commit pins,
    # not floating major tags, and `dist plan` still agrees with it.
    #
    # Caveat: `exclude-paths` is a version-updates-only option. A Dependabot
    # SECURITY PR can still rewrite release.yml, and it will fail `dist plan`
    # with `has out of date contents`. Close it; bump the SHA in
    # `dist-workspace.toml` and re-run `dist generate` instead.
    # `.github/workflows/release-pins.yml` watches both pins for staleness.
    exclude-paths:
      - ".github/workflows/release.yml"
    # Keep SHA pins fresh; human-readable tag comments are updated automatically.
    groups:
      actions-sha-bumps:
        patterns: ["*"]
    ignore:
      # `dtolnay/rust-toolchain`'s ref tag IS the toolchain version (@1.96.0
      # installs 1.96.0); auto-bumping it would advance the MSRV. CI pins
      # @stable and passes the version via `with:` (ci.yml msrv job).
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: docker
    # Bumps Dockerfile FROM pins. The `rust` base is
    # pinned to the MSRV (= rust-toolchain.toml = 1.96.0); auto-bumping it
    # would silently advance the MSRV, so it is ignored — bump it in a
    # deliberate PR alongside rust-toolchain.toml / Cargo `rust-version`.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "rust"

  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
      day: monday
