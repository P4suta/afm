# Composite action: turn a red square on a workflow nobody is required to read
# into something with an assignee.
#
# The jobs that call this run on a clock and gate no merge. What they watch
# moves without a commit — an advisory published against a `Cargo.lock` nobody
# touched, a dependency relicensed upstream, a pin frozen behind its major tag
# — so none of it ever arrives in a pull request, and by default a finding
# produces one red run in the Actions tab and nothing else. A control that only
# reaches whoever remembers to go and look is not a control.
# `rustsec/audit-check` already solves this for RustSec advisories; this is the
# same shape for the scheduled checks that have no reporter of their own.
#
# ONE ROLLING ISSUE PER TITLE, which is the whole design. Pin drift recurs
# every Sunday until somebody bumps the pin, and a relicensed package stays
# relicensed until somebody re-reads the exemption, so filing per run would
# post a weekly copy of a finding that is already open — which teaches a reader
# to ignore the channel, the failure this exists to prevent. The title is what
# a repeat failure is matched against: while an open issue carries it, nothing
# new is filed. Close the issue and the next failure files it again.
#
# No third-party action is called from here on purpose. `.github/actions/` is
# the one directory Dependabot's `github-actions` ecosystem does not reach
# (#243), so a `uses:` added here would be a pin nothing can bump; `gh` ships
# on the runner and the token is the one the calling job already holds.

name: report-failure
description: File a rolling issue for a scheduled check whose failure blocks no merge.

inputs:
  title:
    description: >-
      The issue title, and the key a repeat failure is matched against: while
      an open issue carries this exact title, nothing new is filed.
    required: true
  body:
    description: What the failure means and what to do about it, as Markdown.
    required: true

runs:
  using: composite
  steps:
    - name: File the rolling issue for this failure
      shell: bash
      env:
        # `github.token` rather than an input: the `secrets` context is out of
        # scope inside a composite action. The `issues: write` this needs is
        # granted by the calling JOB, which is what keeps the permission off
        # every other job in that workflow.
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        # Read the titles into a variable first. `gh … | grep -q` leaves gh
        # writing into a pipe grep has already closed, and under `pipefail`
        # that reads back as "no such issue" — which files the duplicate this
        # step exists to avoid. The limit is well over this repository's open
        # count; the far side of it is a re-file, not a lost report.
        open_titles=$(gh issue list --state open --limit 200 --json title --jq '.[].title')
        if grep -qxF -- "$TITLE" <<<"$open_titles"; then
          echo "::notice title=already filed::an open issue is titled \"$TITLE\"; leaving it be"
          exit 0
        fi

        body_file="$RUNNER_TEMP/report-failure.md"
        printf '%s\n\nFailing run: %s\n' "$BODY" "$RUN_URL" > "$body_file"
        gh issue create --title "$TITLE" --body-file "$body_file"
