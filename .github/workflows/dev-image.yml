# Build and publish the aozora-flavored-markdown dev container image to GHCR.
#
# Lets ci.yml `docker pull ghcr.io/p4suta/aozora-md-dev:latest` instead of
# rebuilding the toolchain + cargo dev tools image (30-40 min) on every
# commit.
#
# Triggers are narrow on purpose: only rebuild when the Dockerfile,
# docker-compose.yml, or rust-toolchain pin change.
#
# Tags `:latest` (mutable, pulled by ci.yml) and `:<commit-sha>`
# (immutable, for git-bisect across image-affecting changes).

name: dev-image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'rust-toolchain.toml'
      - '.github/workflows/dev-image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'rust-toolchain.toml'
      - '.github/workflows/dev-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: build & push (ghcr.io/p4suta/aozora-md-dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        # Fork PR builds have no GHCR credentials: build to verify but
        # skip login + push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/p4suta/aozora-md-dev
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - name: Build and push (ci stage)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image
          provenance: false
