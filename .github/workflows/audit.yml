# Dependency hygiene on a clock, rather than only on a diff.
#
# `just deny` and `just audit` are `[group('gate')]` recipes, so ci.yml's gate
# matrix already runs both on every pull request. That covers exactly one
# failure mode: a PR that ADDS a vulnerable dependency. It cannot cover the
# common one — an advisory published against a `Cargo.lock` nobody touched.
# Between two quiet weeks the newest scan of this repo's graph would be two
# weeks old, and `SECURITY.md` said so out loud ("there is no cron workflow").
#
# Four jobs, deliberately independent (no `needs:` between them) so a red gate
# never suppresses the notification that explains it:
#
#   * `advisories` — the authoritative run. Same two recipes, same dev image,
#     same result as a PR. A red run here is the durable record.
#   * `report`     — `rustsec/audit-check`, which on a `schedule` event opens a
#     GitHub issue per newly disclosed advisory. This is the half that makes
#     the schedule a control at all: a cron that only reddens a workflow
#     nobody is watching notifies nobody.
#   * `licences`   — a staleness watch over dependency-review.yml's per-package
#     licence exemptions, which are blanket waivers with nothing checking them.
#   * `dependabot` — the same treatment for the one claim in SECURITY.md that
#     is a repository SETTING rather than a file: that Dependabot alerts and
#     Dependabot security updates are both on.
#
# Scope note: `cargo audit` reads the lockfile it is pointed at, so this covers
# the workspace `Cargo.lock`. The fuzz crate is its own workspace with its own
# `fuzz/Cargo.lock`; it is `publish = false`, reaches no shipped artefact, and
# is not scanned here.
name: audit

on:
  schedule:
    # Daily, 15:40 UTC = 00:40 Asia/Tokyo. Off the hour and clear of the other
    # three crons in this repo: fuzz (daily 16:20), codeql (Mon 04:23) and
    # release-pins (Sun 17:00).
    - cron: "40 15 * * *"
  push:
    branches: [main]
    # The inputs to both scans, plus this file. A merge that changes the
    # resolved graph gets its answer immediately instead of at midnight.
    paths:
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
      - '.github/workflows/dependency-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  # NOT cancel-in-progress: a run cancelled mid-flight can be one that had
  # already found an advisory and not yet filed the issue for it.
  cancel-in-progress: false

jobs:
  # The gate, run exactly as a pull request runs it (ADR-0002: both recipes
  # reach cargo through the dev image).
  advisories:
    name: advisories (cargo-deny + cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      issues: write   # the rolling issue at the end of this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dev-image

      - name: Licences, advisories and bans (cargo-deny)
        run: just deny

      # `!cancelled()` rather than the default `success()`: these two scans
      # answer different questions, and a nightly report that stops at the
      # first one is half a report. Not `continue-on-error` — a failure here
      # still fails the job.
      - name: RustSec advisories (cargo-audit)
        if: ${{ !cancelled() }}
        run: just audit

      # `report` below is not this job's channel. It files what
      # `rustsec/audit-check` finds — RustSec advisories — and cargo-deny
      # answers for four more things: a ban, an unvetted source, a yanked
      # crate, a licence it refuses. A nightly that went red on any of those
      # would otherwise be a red square and nothing else.
      - name: Say where a nightly failure went
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: ./.github/actions/report-failure
        with:
          title: "audit: the nightly dependency scan is failing"
          body: |
            `just deny` or `just audit` failed on a scheduled run of
            `.github/workflows/audit.yml`, against a `Cargo.lock` nobody here
            need have touched.

            A newly disclosed RustSec advisory arrives separately, as its own
            issue from `rustsec/audit-check`. This one also covers the half
            that reporter never sees: a ban, an unvetted source, a yanked
            crate, or a licence `deny.toml` refuses.

            Fix the finding or record the exception in `deny.toml`, then close
            this issue — the next failing run files it again.

  # Turn a finding into something with an assignee. On a `schedule` event
  # rustsec/audit-check opens one issue per advisory, skipping any whose
  # `RUSTSEC-…` id already appears in an open issue or PR title, so a nightly
  # cron does not re-file the same advisory every night. On every other event
  # (push, workflow_dispatch) it writes a check run instead — so a manual
  # re-run is a way to see the report, not a way to file it.
  #
  # ADR-0002 scope: this action installs and runs cargo-audit natively on the
  # runner, outside the dev image. That is tolerable precisely because it is
  # not the gate — `advisories` above is, on the pinned cargo-audit the image
  # ships. This job is a reporter, and it is the reporting that is wanted from
  # it rather than the verdict.
  report:
    name: file an issue per new advisory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write   # reportIssues() on a schedule event
      checks: write   # reportCheck() on every other event
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # `allow-dependencies-licenses` in dependency-review.yml waives the licence
  # check for four packages. A waiver there is per PACKAGE, not per licence —
  # it says "whatever this package declares is fine", forever — and each entry
  # was written against a specific declared string, recorded in that file as
  # prose. Prose is a claim nothing evaluates: if `rustc-demangle` relicensed
  # tomorrow, the exemption written for its unparseable `MIT/Apache-2.0` would
  # wave the new licence straight through and no gate in this repo would say a
  # word.
  #
  # So the same claim, in the form something checks. Not a PR gate: it depends
  # on when an upstream maintainer edits a manifest, so it must never redden an
  # unrelated PR — the same reasoning, and the same shape, as release-pins.yml.
  # A failure means "go re-read the exemption and either drop it or rewrite
  # what it rests on", which is also how the `Drop this entry once…` sentences
  # in that file finally become actionable.
  #
  # `Swatinem/rust-cache` is exempt for a reason that does not depend on what
  # it declares (a CI-only action links into nothing this project ships), so
  # there is nothing to watch and it is absent below by design.
  licences:
    name: licence exemptions still hold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write   # the rolling issue at the end of this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compare each exemption against what crates.io now declares
        run: |
          set -euo pipefail
          review=.github/workflows/dependency-review.yml
          ua='aozora-flavored-markdown-ci (https://github.com/P4suta/aozora-flavored-markdown)'
          fail=0

          # The declared licence each exemption was written for. Keep the
          # reasoning in dependency-review.yml; this is only the string.
          declare -A expected=(
            [rustc-demangle]='MIT/Apache-2.0'
            [minicov]='Apache-2.0/MIT'
            [libfuzzer-sys]='(MIT OR Apache-2.0) AND NCSA'
          )

          # The cargo purls actually listed over there. Reading them rather
          # than restating them is what stops this table from drifting into a
          # second, private list of exemptions.
          mapfile -t declared < <(grep -oE 'pkg:cargo/[A-Za-z0-9_.-]+' "$review" \
                                    | cut -d/ -f2 | sort -u)
          if [ "${#declared[@]}" -eq 0 ]; then
            echo "[!!] no pkg:cargo/… purls parsed out of $review — entry format changed?" >&2
            exit 1
          fi

          # Both directions: an exemption added there without a line here would
          # otherwise go unwatched, and a line here outliving its exemption is
          # a check against nothing.
          for name in "${declared[@]}"; do
            if [ -z "${expected[$name]+set}" ]; then
              printf '[!!] %s is exempted in %s but unwatched here — add its declared licence\n' \
                "$name" "$review" >&2
              fail=1
            fi
          done
          for name in "${!expected[@]}"; do
            if ! printf '%s\n' "${declared[@]}" | grep -qxF "$name"; then
              printf '[!!] %s is watched here but no longer exempted in %s — drop this line\n' \
                "$name" "$review" >&2
              fail=1
            fi
          done

          for name in "${declared[@]}"; do
            [ -n "${expected[$name]+set}" ] || continue
            want=${expected[$name]}
            have=$(curl -fsSL -H "User-Agent: $ua" \
                     "https://crates.io/api/v1/crates/$name" \
                   | jq -r '.crate.max_stable_version as $v
                            | .versions[] | select(.num == $v) | .license')
            if [ "$have" = "$want" ]; then
              printf '[OK] %s still declares %s\n' "$name" "$want"
            else
              printf '[!!] %s now declares %s; the exemption was written for %s\n' \
                "$name" "$have" "$want" >&2
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "Re-read allow-dependencies-licenses in $review: drop the entry, or rewrite what it rests on." >&2
            exit 1
          fi
          echo "licence exemptions: every one still rests on what it was written for"

      # The day this fires is the day it was written for, so it needs somewhere
      # to fire TO. `report` above answers for advisories and files nothing on
      # a licence, and this job blocks no merge, so without the step below the
      # relicensing it exists to catch would land as a red square on a nightly
      # nobody is required to read.
      - name: Say where a nightly failure went
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: ./.github/actions/report-failure
        with:
          title: "audit: a licence exemption no longer holds"
          body: |
            The `licences` job of `.github/workflows/audit.yml` found an
            `allow-dependencies-licenses` entry in
            `.github/workflows/dependency-review.yml` that no longer rests on
            what it was written for — either a package now declaring a
            different licence, or an entry on one side with no counterpart on
            the other. The run below names it.

            That waiver is per package rather than per licence, so until
            somebody re-reads it the dependency-review gate waves through
            whatever the package declares today. Drop the entry, or rewrite the
            licence it rests on in both files, then close this issue — the next
            failing run files it again.

  # SECURITY.md: "Dependabot alerts and Dependabot security updates are both
  # enabled, so GitHub raises the same finding independently and opens the
  # version-bump pull request for it." True when written, and the one sentence
  # in that file resting on nothing in this tree: both are repository SETTINGS,
  # flipped in a menu by anyone with admin rights and carried in no diff, and
  # GitHub pauses security updates on its own after ~90 days of inactivity. So
  # the claim can stop being true with every gate here green — the same defect
  # class the rest of this workflow was written to remove, one level below
  # where a file-reading test can see it. #198 checked it by hand and shipped
  # the check as a comment in a pull request, which is a measurement rather
  # than a control (#201).
  #
  # THE TOKEN, because this is the part that cannot be read off the job below.
  # Both endpoints need Administration: Read on this repository, and
  # `GITHUB_TOKEN` cannot be granted it at any setting: `administration` is not
  # one of the scopes a workflow `permissions:` block can name, so there is no
  # combination of them that reaches these two settings. The job therefore
  # authenticates as `secrets.DEPENDABOT_POSTURE_TOKEN`:
  #
  #   a fine-grained personal access token, "Only select repositories" →
  #   this repository, Repository permissions → Administration: Read, and
  #   nothing else. No write anywhere, no account permissions.
  #
  # `permissions:` below is a different thing and stays minimal for the
  # WORKFLOW token, which is all it governs: `contents: read` for the checkout,
  # `issues: write` for the reporter. Neither reads a setting.
  #
  # Fine-grained tokens expire, so this job has a second failure mode of its
  # own making — and an expired token answers both endpoints exactly as a
  # repository with both settings switched off would. That is why it reports
  # through two channels rather than one: "the posture is off" and "the posture
  # could not be read" are different findings for different people, and filing
  # the second under the first is the false alarm that teaches a reader to stop
  # opening the channel.
  dependabot:
    name: dependabot alerts and security updates still on
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write   # the rolling issues at the end of this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Ask the repository what SECURITY.md says about it
        id: posture
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_POSTURE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Everything that ends "so this job did not read the posture".
          blind() {
            printf '[??] %s\n' "$*" >&2
            printf 'This job reads both settings as DEPENDABOT_POSTURE_TOKEN: fine-grained,\n' >&2
            printf 'this repository only, Administration: Read, no write anywhere. A token\n' >&2
            printf 'that expired, was revoked or lost that permission answers these two\n' >&2
            printf 'endpoints exactly as a repository with both settings off would, so an\n' >&2
            printf 'unread posture exits here and is never reported as a finding.\n' >&2
            exit 1
          }

          [ -n "${GH_TOKEN:-}" ] || blind "DEPENDABOT_POSTURE_TOKEN is unset or empty"

          # Dependabot security updates. Asked FIRST because it is the endpoint
          # that answers with a body — `{"enabled":true,"paused":false}` — which
          # is what tells the token's reach apart from the setting's state.
          fixes=$(gh api "repos/$GH_REPO/automated-security-fixes" 2>&1) \
            || blind "repos/$GH_REPO/automated-security-fixes: $fixes"
          enabled=$(jq -r '.enabled' <<<"$fixes" 2>&1) \
            || blind "automated-security-fixes answered with no readable .enabled: $fixes"
          paused=$(jq -r '.paused' <<<"$fixes" 2>&1) \
            || blind "automated-security-fixes answered with no readable .paused: $fixes"
          case "$enabled $paused" in
            'true true' | 'true false' | 'false true' | 'false false') ;;
            *) blind "automated-security-fixes: enabled=$enabled paused=$paused" ;;
          esac

          # Dependabot alerts: 204 when on, 404 when off. Readable as the
          # setting only because the call above has already shown this token can
          # see repository administration — asked on its own, the 404 here is
          # also what an under-scoped token gets, and the two are indistinguishable.
          if gh api --silent "repos/$GH_REPO/vulnerability-alerts" >/dev/null 2>&1; then
            alerts=on
          else
            alerts=off
          fi

          fail=0
          if [ "$alerts" = on ]; then
            printf '[OK] Dependabot alerts are enabled\n'
          else
            printf '[!!] Dependabot alerts are disabled\n' >&2
            fail=1
          fi
          if [ "$enabled $paused" = 'true false' ]; then
            printf '[OK] Dependabot security updates are enabled and running\n'
          else
            printf '[!!] Dependabot security updates: enabled=%s, paused=%s\n' \
              "$enabled" "$paused" >&2
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            # The posture, read and wrong — as against unread, which leaves
            # through blind() above. The two reporting steps below split on
            # this: re-enabling a setting and renewing a token are different
            # jobs for different people.
            printf 'posture=off\n' >> "$GITHUB_OUTPUT"
            printf 'SECURITY.md says both are enabled and that sentence is now false. Turn them\n' >&2
            printf 'back on under Settings → Code security, or, if this is deliberate, rewrite\n' >&2
            printf 'the paragraph in SECURITY.md that rests on them and this job with it.\n' >&2
            exit 1
          fi
          printf 'dependabot posture: alerts on, security updates on and unpaused\n'

      - name: Say that the posture stopped matching
        if: ${{ failure() && github.event_name == 'schedule' && steps.posture.outputs.posture == 'off' }}
        uses: ./.github/actions/report-failure
        with:
          title: "audit: Dependabot alerts or security updates are no longer on"
          body: |
            The `dependabot` job of `.github/workflows/audit.yml` asked this
            repository for its own settings and got an answer `SECURITY.md` says
            it cannot get: Dependabot alerts disabled, or Dependabot security
            updates disabled or paused. The run below says which.

            Both are settings rather than files, so nothing arrived in a pull
            request to say so, and the paragraph in `SECURITY.md` about GitHub
            raising the same finding independently has been false since it
            happened. GitHub also pauses security updates by itself after a
            long quiet spell, which looks identical here and is fixed the same
            way.

            Turn them back on under Settings → Code security, or rewrite that
            paragraph if the change was meant, then close this issue — the next
            failing run files it again.

      - name: Say that the posture could not be read
        if: ${{ failure() && github.event_name == 'schedule' && steps.posture.outputs.posture != 'off' }}
        uses: ./.github/actions/report-failure
        with:
          title: "audit: the Dependabot posture check cannot see the settings it watches"
          body: |
            The `dependabot` job of `.github/workflows/audit.yml` could not read
            whether Dependabot alerts and Dependabot security updates are on.
            That is this check failing, rather than the thing it checks: while
            it lasts, the claim in `SECURITY.md` is unverified rather than
            false.

            Both endpoints need Administration: Read on this repository, which
            `GITHUB_TOKEN` cannot hold — `administration` is not a scope a
            workflow `permissions:` block can name. The job runs as
            `secrets.DEPENDABOT_POSTURE_TOKEN` instead: a fine-grained token,
            this repository only, Repository permissions → Administration:
            Read, nothing else. Fine-grained tokens expire, so the usual cause
            is that one lapsed.

            Mint a replacement, update the secret, then close this issue — the
            next failing run files it again.
