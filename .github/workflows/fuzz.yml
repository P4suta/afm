name: fuzz

on:
  schedule:
    - cron: "20 16 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust just cargo:cargo-fuzz
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: scheduled-fuzz

      - name: Build every fuzz target
        id: build
        continue-on-error: true
        run: just fuzz-build

      - name: Exercise every fuzz target
        id: run
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 55m just fuzz-all-deep
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "state=timeout" >> "$GITHUB_OUTPUT"
          elif find crates/aozora-flavored-markdown/fuzz/artifacts -type f -print -quit 2>/dev/null | grep -q .; then
            echo "state=crash" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=run-failure" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Record termination state
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_STATE: ${{ steps.run.outputs.state }}
        run: |
          mkdir -p target/fuzz-status
          if [ "$BUILD_OUTCOME" != "success" ]; then
            state=build-failure
          else
            state="$RUN_STATE"
            test -n "$state" || state=run-failure
          fi
          printf '%s\n' "$state" | tee target/fuzz-status/state.txt
          {
            printf '## Fuzz termination state\n\n'
            printf '`%s`\n' "$state"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$state" in
            success) ;;
            build-failure) echo "::error::one or more fuzz targets did not build"; exit 1 ;;
            timeout) echo "::error::the scheduled fuzz sweep exceeded its workflow budget"; exit 1 ;;
            crash) echo "::error::libFuzzer wrote a crash artifact"; exit 1 ;;
            *) echo "::error::the fuzz process failed without a crash artifact"; exit 1 ;;
          esac

      - name: Upload crash corpus and state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.6.2
        with:
          name: fuzz-artifacts
          if-no-files-found: warn
          path: |
            target/fuzz-status/
            crates/aozora-flavored-markdown/fuzz/artifacts/
