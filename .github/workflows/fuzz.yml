# Running the fuzz targets, as opposed to compiling them.
#
# Compiling them is `just fuzz-build`, a `[group('gate')]` recipe that ci.yml's
# matrix expands like any other — that is the half a PR must pass, and it is
# there because the fuzz crate declares its own `[workspace]` (it has to:
# libfuzzer-sys is nightly-only) and so was compiled by nothing at all.
#
# This workflow is the other half: actually feeding the harnesses. It is
# deliberately NOT a required check. A fuzzer is a search, so a red run here
# means "an input was found", which is a bug report and not a reason to block
# an unrelated PR — and a 20-minute search is not something to put in front of
# every merge either. The split is per event:
#
#   * pull_request → `just fuzz-all-quick` (60 s a target), enough to catch an
#     invariant a change broke on the very first mutation of a committed seed.
#   * schedule     → `just fuzz-all-deep` (5 min a target), the sweep whose
#     comment has always called it "the gate before tagging a release" and
#     which nothing ran until DEV-230 gave the recipes a target triple they
#     could build for.
#
# Whatever libFuzzer writes into `fuzz/artifacts/` on a failure is uploaded, so
# a crash found on a runner can be replayed locally with `just fuzz-triage`
# instead of re-found.
name: fuzz

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'Justfile'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Daily, 16:20 UTC = 01:20 Asia/Tokyo. Off the hour, and clear of both the
    # weekly CodeQL scan (Mon 04:23) and the release-pins watch (Sun 17:00).
    - cron: "20 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: sweep (${{ github.event_name == 'schedule' && 'deep' || 'quick' }})
    runs-on: ubuntu-latest
    # Every target for 5 min, plus a cold sanitizer build of the graph. Generous
    # rather than tight: the failure this bounds is libFuzzer hanging, and each
    # recipe already wraps its own run in `timeout`.
    timeout-minutes: 60
    env:
      # Chosen here rather than inside `run:`, so the event never reaches a
      # shell as text (zizmor's template-injection rule, and the reason every
      # computed value in this repo's workflows arrives through the
      # environment).
      SWEEP: ${{ github.event_name == 'schedule' && 'fuzz-all-deep' || 'fuzz-all-quick' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dev-image

      # The corpus is committed (`just fuzz-seed`), so this starts from the
      # repo's own example documents and every CommonMark / GFM spec example
      # rather than from a single empty byte string.
      - name: Sweep every registered fuzz target
        run: just "$SWEEP"

      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-artifacts
          path: crates/aozora-flavored-markdown/fuzz/artifacts/
          # A failure that wrote nothing is a build or image problem, not a
          # finding; say so with a warning instead of failing the upload.
          if-no-files-found: warn
