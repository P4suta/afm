name: publish-crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no upload)"
        type: boolean
        default: true
      use_oidc:
        description: "Use crates.io OIDC only after every selected crate has a Trusted Publisher"
        type: boolean
        # The unpublished EPUB pair cannot register Trusted Publishers until
        # after its token-authenticated bootstrap upload.
        default: false
      skip_crates:
        description: "Comma-separated publishable package names already uploaded by an earlier attempt"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.96.0 just cargo:cargo-semver-checks
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: publish-crates-preflight
      - run: just changelog-check
      - name: Dry-run the same crate selection as a live retry
        env:
          SKIP_CRATES: ${{ inputs.skip_crates }}
        run: just package-smoke "$SKIP_CRATES"
      - run: just semver

  publish:
    name: publish
    needs: preflight
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: publish-crates-publish
      - name: Authenticate to crates.io
        id: auth
        if: ${{ inputs.use_oidc }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
      - name: Publish four crates in workspace dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.use_oidc && steps.auth.outputs.token || secrets.CARGO_TOKEN }}
          SKIP_CRATES: ${{ inputs.skip_crates }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          scripts/publish-excludes.sh "$SKIP_CRATES" > "$work/excludes"
          mapfile -t excludes < "$work/excludes"
          : > "$work/skipped"
          for ((i = 1; i < ${#excludes[@]}; i += 2)); do
            printf '%s\n' "${excludes[i]}" >> "$work/skipped"
          done
          cargo metadata --locked --no-deps --format-version 1 \
            > "$work/metadata.json"
          jq -r --rawfile skipped "$work/skipped" '
            ($skipped | split("\n") | map(select(length > 0))) as $skipped
            | .packages[]
            | select(.publish != [] and (.name as $name | $skipped | index($name) | not))
            | .name
          ' "$work/metadata.json" > "$work/selected"
          mapfile -t selected < "$work/selected"
          printf 'publish selected %d crate(s):\n' "${#selected[@]}"
          if (( ${#selected[@]} == 0 )); then
            printf '  (none)\n'
            echo "all publishable crates were skipped; nothing to publish"
            exit 0
          fi
          printf '  %s\n' "${selected[@]}"
          cargo publish --workspace --locked "${excludes[@]}"
