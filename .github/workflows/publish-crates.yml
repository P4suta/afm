# cargo publish workflow for the aozora-flavored-markdown workspace.
#
# One command publishes the whole ladder. `cargo publish --workspace` reads the
# dependency graph, uploads in topological order — each library before the
# crates that depend on it — and waits for an upload to appear in the crates.io
# index before uploading its dependents (cargo-publish(1), step 4), so no step
# here sleeps or sequences anything by hand. Multi-package publish stabilised
# in Cargo 1.89 (`-Zpackage-workspace`) and this workspace pins 1.96.0.
# ADR-0015 rejected `--workspace` for not ordering first-publishes, on a
# toolchain that already had it; the amended ADR records the dry-run that
# reversed the finding.
#
# The set is a fact about the manifests rather than a list this file keeps in
# step: cargo skips the `publish = false` members itself. Those are
# aozora-flavored-markdown-wasm (ships via wasm-pack/npm), and
# aozora-flavored-markdown-test-support / xtask (dev-only).
#
# ADR-0002 scope exception: this runs on the native runner toolchain rather
# than the dev image (like the `msrv` CI job). Publishing is a release
# operation that needs only cargo + rustc, not the dev-image tool belt.
#
# SECURITY MODEL (industry-standard, mirrors P4suta/aozora):
#   * The live `publish` job runs in the `release` GitHub Environment, so
#     it pauses for required-reviewer approval and can only reach
#     credentials after a deployment protection rule passes. The `package`
#     dry-run smoke test runs ungated (no credentials needed).
#   * Default `use_oidc: true` mints a short-lived crates.io token via
#     OIDC Trusted Publishing (rust-lang/crates-io-auth-action), revoked
#     automatically when the job ends — no long-lived secret.
#     Ref: https://crates.io/docs/trusted-publishing
#   * Default `dry_run: true` so a stray "Run workflow" click cannot push.
#
# How to run a real publish (steady state, no secret):
#   gh workflow run publish-crates.yml -f dry_run=false   # then approve
#
# Register the trusted publisher once per crate: crates.io → the crate →
# Settings → Trusted Publishing → GitHub, owner=P4suta,
# repo=aozora-flavored-markdown, workflow=publish-crates.yml,
# environment=release. Once all four carry one, delete the CARGO_TOKEN
# secret.
#
# The bootstrap is not done yet, and going from two rungs to four is why:
# `aozora-flavored-markdown` and its CLI are on crates.io (v0.4.1) and can be
# configured today, but the two EPUB crates are 404 and crates.io has nothing
# to attach a publisher to until a crate exists. One `cargo publish
# --workspace` carries one token, so that is a fact about the whole ladder and
# not those two rungs alone: the run that first uploads them goes through the
# legacy token path (`-f use_oidc=false` with CARGO_TOKEN), and every run
# after it can use OIDC.
#
# NOTE on dry-run coverage: the whole ladder is dry-runnable before any of it
# exists on crates.io. Cargo packages each member into a temporary registry
# under `target/package/` and resolves the next member against it, so a crate
# whose dependency is not yet published still builds exactly as a consumer
# will build it. Under `--dry-run` the "already exists on crates.io" check
# that stops a real run is downgraded to a warning, which is what lets the
# preflight below run on every dispatch.

name: publish-crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no upload): packages + verifies every publishable crate"
        type: boolean
        default: true
      use_oidc:
        description: "Authenticate via OIDC Trusted Publishing. Uncheck to fall back to the CARGO_TOKEN env secret."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Serialize publishes — crates.io accepts versions linearly and a second
  # concurrent run would just waste tokens.
  group: publish-crates
  cancel-in-progress: false

jobs:
  # Preflight — runs ungated on every dispatch (no credentials, so no
  # environment approval needed). Two questions, both answerable before an
  # upload: do the packages still build from their own metadata (all of them,
  # in the order they would go up), and does the version about to go out
  # cover the API changes in it. A live publish `needs:` this job, so either
  # regression surfaces before anything is uploaded — and an upload is the one
  # operation crates.io will not let anybody take back.
  #
  # Both steps are the SAME recipes the PR gates run, not a second spelling of
  # them: `AOZORA_MD_IN_CONTAINER` tells the Justfile's `_in` switch this job
  # is already outside the dev image, so each recipe resolves its tool from what
  # `install-action` put on the runner. Asking them again here is not redundant
  # with the PR gates — a tag is what gets published, and a tag is not required
  # to be a commit any PR ever ran.
  #
  # `just package` used to be this job's own `cargo publish --workspace
  # --dry-run --locked`, which made this file the only place the packaging
  # check existed — and this file runs on dispatch. It is a `[group('gate')]`
  # recipe now (DEV-224), so every pull request packages the ladder and this
  # job calls the recipe rather than keeping a second copy of its command.
  package:
    runs-on: ubuntu-latest
    env:
      AOZORA_MD_IN_CONTAINER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The semver step resolves its baseline as a TAG out of this
          # checkout; the default depth-1 clone carries none.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: publish-crates-package
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: cargo-semver-checks,just

      - name: Dry-run the ladder (packages and verifies every publishable crate)
        run: just package

      - name: Semver preflight (public API against the baseline)
        run: just semver

  # Live publish in topological order, gated behind the `release`
  # environment (required-reviewer approval + deployment branch/tag
  # restriction). Credentials are only reachable after approval.
  publish:
    needs: package
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write  # mint a short-lived crates.io token via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: publish-crates-publish

      # OIDC Trusted Publishing: exchange the job's OIDC token for a
      # 30-minute crates.io API token, auto-revoked when the job ends.
      # Skipped (legacy CARGO_TOKEN fallback) when use_oidc=false.
      - name: Authenticate to crates.io (OIDC Trusted Publishing)
        id: auth
        if: ${{ inputs.use_oidc }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      # A partial run is NOT resumable by re-dispatch. Cargo checks every
      # selected member against the registry before it packages or uploads
      # anything, and a version already there is a hard error
      # ("crate foo@1.2.3 already exists on crates.io"), not a skip — so a
      # second dispatch stops on the crates that did land instead of
      # continuing with the ones that did not. Finish such a run by hand,
      # `cargo publish -p <crate> --locked` per crate still missing, in
      # dependency order. The same goes for a rate-limited upload: it fails
      # the run rather than sleeping inside it.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.use_oidc && steps.auth.outputs.token || secrets.CARGO_TOKEN }}
        run: cargo publish --workspace --locked
