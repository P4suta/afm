name: publish-crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no upload)"
        type: boolean
        default: true
      use_oidc:
        description: "Use crates.io OIDC trusted publishing"
        type: boolean
        default: true
      skip_crates:
        description: "Comma-separated publishable package names already uploaded by an earlier attempt"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea  # v4.2.1
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.96.0 just cargo:cargo-semver-checks
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: publish-crates-preflight
      - run: just changelog-check
      - run: just package-smoke
      - run: just semver
      - name: Validate retry skip list against Cargo metadata
        env:
          SKIP_CRATES: ${{ inputs.skip_crates }}
        run: scripts/publish-excludes.sh "$SKIP_CRATES" >/dev/null

  publish:
    name: publish
    needs: preflight
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea  # v4.2.1
        with:
          version: 2026.7.13
          cache: true
          install_args: rust@1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: publish-crates-publish
      - name: Authenticate to crates.io
        id: auth
        if: ${{ inputs.use_oidc }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
      - name: Publish four crates in workspace dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.use_oidc && steps.auth.outputs.token || secrets.CARGO_TOKEN }}
          SKIP_CRATES: ${{ inputs.skip_crates }}
        run: |
          mapfile -t excludes < <(scripts/publish-excludes.sh "$SKIP_CRATES")
          cargo publish --workspace --locked "${excludes[@]}"
