# aozora-flavored-markdown CI. The `setup-dev-image` composite action pulls the dev image published
# by dev-image.yml (or falls back to a local build), then `just <target>` runs
# on the runner host — each recipe wraps cargo in `docker compose run` itself,
# so this avoids Docker-in-Docker. Action SHAs are pinned; Dependabot bumps weekly.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  DOCKER_BUILDKIT: "1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Change-aware gating. `dorny/paths-filter` classifies the PR (or push) diff
  # so the heavy compile/test/lint matrix is skipped on docs-only changes; the
  # `ci-success` aggregator (bottom) tolerates the resulting "skipped" results.
  # Unlike aozora, aozora-flavored-markdown has no build-once `dev-image` job to skip (every job
  # self-provisions cheaply via the GHCR pull), so this mainly saves the
  # compile / test / coverage matrix, not an image build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - 'Justfile'
              - 'playground/**'
              - '.github/**'

  msrv:
    # Verify that the pinned MSRV (1.96.0, see `rust-toolchain.toml`)
    # still builds. ADR-0002 scope exception: native runner toolchain
    # rather than dev image — an independent clean rustc 1.96.0 install
    # that proves the declared MSRV builds without the dev-image layer.
    name: msrv (rust 1.96.0)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust 1.96.0 (MSRV)
        # NB: dtolnay/rust-toolchain uses the action ref tag AS the
        # Rust toolchain version. Pin @stable + pass MSRV via `with:`
        # so Dependabot doesn't unintentionally march the MSRV forward
        # (see .github/dependabot.yml ignore entry).
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: msrv
      # `--locked` for the same reason every Justfile recipe carries it: this
      # job resolves on a bare runner, outside the dev image, so without it a
      # newer-than-Cargo.lock dependency could be what actually proves the MSRV.
      - run: cargo check --locked --workspace --all-targets

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          tool: committed
      # Dependabot's auto-generated subjects/bodies exceed committed's 50/72
      # limits, so skip the lint for bot-authored PRs (squash-merged with a
      # maintainer subject anyway). Guard on the PR *author*, not github.actor:
      # a human re-trigger (e.g. `gh pr update-branch`) changes the actor but
      # not the author, so an actor guard would wrongly lint the bot's commits.
      # `--no-merge-commit` ignores `update-branch` merge commits. The job still
      # runs and succeeds, keeping the required "commitlint" check green.
      - name: Check Conventional Commits (committed)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: committed --no-merge-commit "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # Phase-1 fast gate (`cargo check`, no codegen). Phase-2 jobs gate on this
  # so a compile error surfaces in minutes, not after a full build+test.
  check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-dev-image
      - run: just check

  # Phase-2 (needs check). `cargo doc` is the only pass that runs
  # `broken_intra_doc_links = "deny"`; without it a broken link escapes to
  # docs.yml post-merge and blocks the Pages deploy.
  doc:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-dev-image
      - run: just doc

  # Phase-2 (needs check). Shell completions + man page drift gate: fails if the
  # committed dist/assets weren't regenerated (`just dist-assets`) after a CLI
  # change. Enforced here and inside `just ci`.
  dist-assets-check:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-dev-image
      - run: just dist-assets-check

  # Phase-2 (needs check). Build aozora-flavored-markdown-wasm + the Vite playground at PR time so
  # a wasm-pack or playground break fails here, not post-merge in docs.yml.
  wasm-build:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-dev-image
      - run: just wasm-build
      - run: just playground-build

  # Phase-1 (parallel with `check`). Style + grep checks, no compile dependency.
  # Matrixed so the four legs run concurrently (wall-time ≈ the slowest leg,
  # clippy). aozora-flavored-markdown's `just clippy` is already `--all-targets`, so it is the strict
  # surface — there is no separate clippy-strict leg (unlike aozora).
  lint:
    name: lint (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [fmt-check, clippy, typos, strict-code, comment-discipline]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-dev-image
      - run: just ${{ matrix.target }}

  # Phase-1 (parallel). Pure grep on the bare runner; catches tool-version
  # pin drift across Dockerfile / playground/package.json / docs.yml.
  verify-version-pins:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: just
      - run: just verify-version-pins

  # Phase-2 (needs check). Full build + test cycle.
  build-and-test:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-dev-image
      - run: just build
      - run: just test
      - run: just test-doc

  # Phase-2 (needs check). CommonMark + GFM conformance. (Aozora-layer specs
  # live in the aozora repo; aozora-flavored-markdown exercises the pipeline via `aozora_parity`.)
  spec:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-dev-image
      - run: just spec

  # Phase-2 (needs check). Instrumented compile, slow.
  coverage:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-dev-image
      - run: just coverage

  # Phase-2 (needs check; `udeps` is nightly and needs the dep graph compiled).
  audit:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [deny, shear, audit, udeps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-dev-image
      - run: just ${{ matrix.target }}

  # Aggregate gate. Branch protection requires only this job (plus the CodeQL
  # contexts), so adding / removing / renaming a job above never needs a branch
  # protection settings change. Fails iff a job that actually RAN failed or was
  # cancelled; change-aware SKIPPED jobs report "skipped" and are fine.
  ci-success:
    name: ci-success
    if: always()
    needs:
      - changes
      - msrv
      - commitlint
      - check
      - doc
      - dist-assets-check
      - wasm-build
      - lint
      - verify-version-pins
      - build-and-test
      - spec
      - coverage
      - audit
    runs-on: ubuntu-latest
    steps:
      - name: Gate on CI job results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::a required CI job failed or was cancelled — see the job list above"
          exit 1
      - name: All CI jobs passed or were skipped
        run: echo "ci-success ✔"
