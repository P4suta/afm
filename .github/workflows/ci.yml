name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.96.0 just cargo:cargo-nextest cargo:cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          key: ci-rust
      - run: just ci-rust

  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve canonical playground UI commit
        id: playground-ui-lock
        run: |
          commit="$(jq -er '.upstreamCommit' playground/vendor/playground-ui.lock.json)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: P4suta/aozora
          ref: ${{ steps.playground-ui-lock.outputs.commit }}
          path: .upstream-aozora
          fetch-depth: 1
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.96.0 bun node just cargo:wasm-pack npm:binaryen
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          key: ci-web
      - name: Build WASM and install web dependencies
        run: just playground-install
      - name: Install Playwright system dependencies
        working-directory: playground
        run: bun x --no-install playwright install --with-deps chromium firefox webkit
      - name: Install deterministic screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-core fonts-takao-gothic
      - name: Verify canonical playground UI snapshot
        working-directory: playground
        run: bun run vendor:verify -- ../.upstream-aozora
      - run: just ci-web
      - name: Upload web test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-reports-${{ github.sha }}
          path: |
            playground/playwright-report/
            playground/test-results/
            playground/.lighthouseci/reports/
          retention-days: 14
          if-no-files-found: ignore

  repo:
    name: repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.96.0 just cargo:cargo-deny actionlint shellcheck zizmor
            github:crate-ci/typos
      - run: just ci-repo

  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: 2026.7.13
          cache: true
          install_args: >-
            rust@1.96.0 just cargo:cargo-dist cargo:cargo-release
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          key: ci-release
      - run: just ci-release

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: 2026.7.13
          cache: true
          install_args: rust just cargo:cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          key: ci-fuzz
      - run: just ci-fuzz

  ci-success:
    name: ci-success
    if: always()
    needs: [rust, web, repo, release, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Require every fixed CI job
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::a required CI job failed, was cancelled, or was skipped"
          exit 1
      - run: echo "ci-success"
