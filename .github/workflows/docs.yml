# Publish rustdoc + the browser playground to GitHub Pages.
#
# aozora-flavored-markdown publishes to docs.rs; this job also builds rustdoc
# locally and serves it at `/aozora-flavored-markdown/api/`, with the
# playground at `/aozora-flavored-markdown/playground/`. The site root
# redirects to the API reference.
#
# Docs builds use the native runner toolchain, not the dev Docker image:
# the Pages deploy actions expect artefacts on the runner filesystem.
# `toolchain: stable` is what asks for the newest stable rustc; the action
# itself is commit-pinned like every other (zizmor.yml `unpinned-uses`), so
# "newest" is a statement about the compiler, never about the action's code.

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; `deploy` re-declares the two write scopes it needs, so
# the long `build` job (rustdoc + wasm + a bun install) never holds a token
# that can publish to Pages.
permissions:
  contents: read

# One deploy at a time; queue the rest so we never partially overwrite
# the Pages bucket.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: docs

      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: just

      # The `doc` gate's own recipe, RUSTDOCFLAGS included. This step used to
      # spell the command out with its own `-D warnings`, which the PR gate did
      # not have: two definitions of one build, differing in exactly the
      # direction that lets a rustdoc regression merge and fail here instead.
      #
      # `AOZORA_MD_IN_CONTAINER=1` is what lets a workflow outside the dev image
      # run a `just` recipe — the `_in` switch at the top of the Justfile then
      # resolves rustdoc directly, so the build uses the stable toolchain
      # installed above and writes `target/doc` where the Pages upload can find
      # it. Same arrangement as ci.yml's two `[group('native')]` gates.
      - name: Build rustdoc
        env:
          AOZORA_MD_IN_CONTAINER: "1"
        run: just doc

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          # Keep in sync with the Dockerfile BUN_VERSION arg.
          bun-version: '1.3.14'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          # Keep in sync with the Dockerfile WASM_PACK_VERSION arg.
          version: 'v0.15.0'

      - name: Build aozora-flavored-markdown-wasm package
        # `-- --locked` reaches the `cargo build` wasm-pack shells out to.
        run: wasm-pack build crates/aozora-flavored-markdown-wasm --target bundler --release --out-dir pkg --out-name aozora_flavored_markdown_wasm -- --locked

      - name: Install playground deps
        run: cd playground && bun install --frozen-lockfile

      - name: Build playground
        run: cd playground && bun run build

      # `cargo doc` writes no entry page for a workspace of several crates —
      # the rustdoc flag that would (`--enable-index-page`) is nightly-only and
      # this repo ships on stable — so `api/` held every crate's directory and
      # no `index.html` of its own. That is the URL `[workspace.package]
      # documentation` gives every reader of every published crate, and the one
      # the site root redirects to below: both were a 404 for as long as the
      # site has existed. It redirects on to the library the site is about.
      # `the_documentation_url_this_workspace_advertises_lands_on_the_library`
      # in `crates/xtask/tests/gate_wiring.rs` walks these hops and fails if one
      # of them stops landing on a page exactly one documented target writes.
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site/api site/playground
          cp -r target/doc/. site/api/
          cp -r playground/dist/. site/playground/
          printf '%s\n' \
            '<!doctype html><meta http-equiv="refresh" content="0; url=aozora_flavored_markdown/">' \
            > site/api/index.html
          printf '%s\n' \
            '<!doctype html><meta http-equiv="refresh" content="0; url=api/">' \
            > site/index.html
          # Without this, Pages runs Jekyll and hides paths like `_sources`.
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the uploaded artifact to the Pages bucket
      id-token: write   # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        id: deployment
