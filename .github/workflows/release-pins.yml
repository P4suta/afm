# Freshness watch for the release pipeline's hand-maintained pins.
#
# `.github/workflows/release.yml` is generated by cargo-dist, so Dependabot
# skips it (`exclude-paths` in .github/dependabot.yml) and its action refs are
# instead pinned by `[dist.github-action-commits]` in dist-workspace.toml —
# a file no updater reads (Dependabot's cargo ecosystem parses Cargo.toml /
# Cargo.lock only). Without this job those pins, and the `cargo-dist-version`
# generator pin next to them, would freeze silently.
#
# Not a PR gate: it depends on upstream release timing, so it must never redden
# an unrelated PR. That leaves a failure with nowhere to go by itself, which is
# why the job files a rolling issue: a red square on a run that blocks no merge
# is a control for whoever remembers to open the Actions tab, and nobody does.
# One issue per finding, not one per run — drift recurs every Sunday until
# somebody bumps the pin, and a weekly copy of a report that is already open is
# how a channel stops being read.
name: release-pins

on:
  schedule:
    # Sunday 17:00 UTC = Monday 02:00 Asia/Tokyo, the Dependabot slot.
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pins
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # the rolling issue at the end of this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare dist-workspace.toml pins against upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fail=0

          # Generator pin vs. the newest non-prerelease dist release.
          have="v$(grep -oE 'cargo-dist-version = "[0-9]+\.[0-9]+\.[0-9]+"' dist-workspace.toml \
                     | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          want=$(gh api repos/axodotdev/cargo-dist/releases \
                   --jq 'map(select(.draft == false and .prerelease == false)) | .[0].tag_name')
          if [ "$have" = "$want" ]; then
            printf '[OK] cargo-dist-version %s is the newest dist release\n' "$have"
          else
            printf '[!!] cargo-dist-version is %s; newest dist release is %s\n' "$have" "$want" >&2
            fail=1
          fi

          # Action pins: each commit must still be the tip of its major tag.
          # Comparing within the major (not "newest release") keeps backported
          # releases on older majors from raising a false alarm; a major bump
          # rides along with the dist upgrade that changes the template.
          pin_re='^"\(actions/[a-z-]*\)" = "\([0-9a-f]\{40\}\)"[[:space:]]*# \(v[0-9.]*\)$'
          pins=$(sed -n "s|$pin_re|\1 \2 \3|p" dist-workspace.toml)
          declared=$(grep -c '^"actions/' dist-workspace.toml)
          parsed=$(printf '%s' "$pins" | grep -c '' || true)
          if [ "$parsed" -ne "$declared" ]; then
            printf '[!!] parsed %s of %s [dist.github-action-commits] pins — entry format changed?\n' \
              "$parsed" "$declared" >&2
            exit 1
          fi

          while read -r action sha ver; do
            major=${ver%%.*}
            tip=$(gh api "repos/$action/git/ref/tags/$major" --jq '.object.sha')
            if [ "$sha" = "$tip" ]; then
              printf '[OK] %s %s is the tip of %s\n' "$action" "$ver" "$major"
            else
              printf '[!!] %s is pinned to %s (%s); %s now points at %s\n' \
                "$action" "$ver" "$sha" "$major" "$tip" >&2
              fail=1
            fi
          done <<< "$pins"

          if [ "$fail" -ne 0 ]; then
            echo "Update dist-workspace.toml, run \`dist generate\`, commit both." >&2
            exit 1
          fi
          echo "release-pins: every pin is current"

      # Filed on the schedule only. A `workflow_dispatch` is somebody already
      # watching this run, so it stays a way to SEE the report rather than a
      # way to file one.
      - name: Say where a scheduled failure went
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: ./.github/actions/report-failure
        with:
          title: "release-pins: a hand-maintained release pin has frozen behind upstream"
          body: |
            The weekly `.github/workflows/release-pins.yml` run found a pin in
            `dist-workspace.toml` that is no longer what it names: either
            `cargo-dist-version` behind the newest dist release, or an
            `actions/*` commit that is no longer the tip of its major tag. The
            run below says which.

            Nothing else watches these. `.github/workflows/release.yml` is
            generated by cargo-dist and excluded from Dependabot, and its
            action refs live in `dist-workspace.toml`, which Dependabot's cargo
            ecosystem does not read — so this issue is the only notice the
            release path gets.

            Update `dist-workspace.toml`, run `dist generate`, commit both,
            then close this issue — the next failing run files it again.
